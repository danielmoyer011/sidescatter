name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel matches the Intel Mac installer build, so a dependency
        # with no Intel Mac wheels fails here instead of at release time.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: FlowJo reference workspaces (FlowKit test data)
        run: git clone --depth 1 https://github.com/whitews/FlowKit.git .testdata/FlowKit
      - run: pip install -e ".[dev]"
      - run: pytest -q
