name: Build installers

# Push a tag like v0.1.0 to build Windows, macOS and Linux downloads and
# attach them to a GitHub Release. Builds are unsigned for now.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Sidescatter-windows.zip
          - os: macos-latest
            artifact: Sidescatter-macos-arm64.dmg
          - os: macos-15-intel
            artifact: Sidescatter-macos-intel.dmg
          - os: ubuntu-22.04
            artifact: Sidescatter-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: python packaging/build.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Sidescatter -DestinationPath ${{ matrix.artifact }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname Sidescatter -srcfolder dist/Sidescatter.app -ov -format UDZO ${{ matrix.artifact }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }} -C dist Sidescatter
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Sidescatter-*
          generate_release_notes: true
          prerelease: true
