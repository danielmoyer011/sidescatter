[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidescatter"
dynamic = ["version"]
description = "Free, open-source flow cytometry analysis with spectral unmixing"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "flowkit>=1.3",
    "numpy>=1.24",
    "scipy>=1.8",
    "pandas>=2.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
sidescatter = "sidescatter.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sidescatter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
sidescatter = ["demo_data/spectral/*.fcs", "demo_data/spectral/*.csv", "demo_data/spectral/LICENSE-flowSpecs", "demo_data/spectral/controls/*.fcs", "resources/icons/*", "resources/fonts/*"]
